<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Scam Detection</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }
        h1 { margin-bottom: 20px; }
        .upload-area {
            border: 2px dashed #3b82f6;
            padding: 40px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .upload-area:hover { background-color: #3b82f620; }
        .status {
            font-weight: bold;
            color: #3b82f6;
            margin-top: 15px;
            min-height: 24px;
        }
        .transcript-box {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            min-height: 80px;
            font-style: italic;
            color: #cbd5e1;
            display: none;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
        }
        .scam { background-color: #ef4444; color: white; }
        .legitimate { background-color: #22c55e; color: white; }
        .reset-btn {
            margin-top: 25px;
            padding: 10px 20px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            display: none;
            transition: 0.3s;
        }
        .reset-btn:hover { background-color: #2563eb; }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background-color: #0f172a;
            color: #94a3b8;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active { background-color: #3b82f6; color: white; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .mic-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.3s;
        }
        .mic-btn.start { background-color: #22c55e; color: white; }
        .mic-btn.start:hover { background-color: #16a34a; }
        .mic-btn.stop { background-color: #ef4444; color: white; }
        .mic-btn.stop:hover { background-color: #dc2626; }
        .live-transcript {
            background-color: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            min-height: 80px;
            color: #cbd5e1;
        }
        .live-alert {
            margin-top: 15px;
            padding: 16px;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: bold;
            background-color: #374151;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Voice Scam Detector</h1>

        <div class="tabs">
            <button class="tab-btn active" id="tab-upload-btn" onclick="switchTab('upload')">Upload a Recording</button>
            <button class="tab-btn" id="tab-live-btn" onclick="switchTab('live')">Live Call Monitor</button>
        </div>

        <div class="tab-panel active" id="tab-upload">
            <div class="upload-area" id="dropzone" onclick="document.getElementById('audio-upload').click()">
                <p>Click to Upload Audio (.wav)</p>
                <input type="file" id="audio-upload" accept=".wav" style="display: none;">
            </div>

            <div class="status" id="status-text"></div>
            <div class="transcript-box" id="transcript">Waiting for audio...</div>
            <div class="result-box" id="result"></div>
            <button class="reset-btn" id="reset-btn" onclick="resetUpload()">Upload Another File</button>
        </div>

        <div class="tab-panel" id="tab-live">
            <p style="color: #94a3b8; margin-bottom: 15px;">
                Every 3 seconds of audio is transcribed and appended to the running
                transcript, which is re-checked for scam intent as the call continues.
            </p>
            <button class="mic-btn start" id="live-toggle-btn" onclick="toggleLive()">Start Listening</button>
            <div class="live-alert" id="live-alert">🎙️ Not listening</div>
            <div class="live-transcript" id="live-transcript">(transcript will appear here)</div>
            <div class="status" id="live-status"></div>
        </div>
    </div>

    <script>
        document.getElementById('audio-upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const status = document.getElementById('status-text');
            const transcriptBox = document.getElementById('transcript');
            const resultBox = document.getElementById('result');

            // Reset UI
            status.innerText = "Uploading audio...";
            transcriptBox.style.display = "block";
            transcriptBox.innerText = "Listening...";
            resultBox.style.display = "none";
            document.getElementById('reset-btn').style.display = "none";

            // Upload via fetch but read stream
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/detect_stream', {
                    method: 'POST',
                    body: formData
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, {stream: true});
                    
                    // Split by double newline (standard SSE event separator)
                    let events = buffer.split(/\r?\n\r?\n/);
                    buffer = events.pop(); // Keep the last incomplete part in the buffer
                    
                    for (let block of events) {
                        let lines = block.split(/\r?\n/);
                        let eventType = "message";
                        let dataRaw = "";
                        
                        for (let line of lines) {
                            if (line.startsWith('event:')) {
                                eventType = line.substring(6).trim();
                            } else if (line.startsWith('data:')) {
                                dataRaw = line.substring(5).trim();
                            }
                        }
                        
                        if (dataRaw) {
                            try {
                                const data = JSON.parse(dataRaw);
                                if (eventType === 'status') {
                                    status.innerText = data.message;
                                } 
                                else if (eventType === 'transcript') {
                                    transcriptBox.innerText = '"' + data.text + '"';
                                } 
                                else if (eventType === 'result') {
                                    status.innerText = "Analysis Complete!";
                                    resultBox.style.display = "block";
                                    resultBox.innerText = 'Prediction: ' + data.prediction + ' (in ' + data.total_latency.toFixed(2) + 's)';
                                    
                                    if (data.prediction.toLowerCase().includes("scam")) {
                                        resultBox.className = "result-box scam";
                                    } else {
                                        resultBox.className = "result-box legitimate";
                                    }
                                    
                                    document.getElementById('reset-btn').style.display = "inline-block";
                                }
                            } catch(e) {
                                console.error("Parse error:", e);
                            }
                        }
                    }
                }
            } catch (err) {
                status.innerText = "Error analyzing audio: " + err.message;
                status.style.color = "red";
            }
        });

        function resetUpload() {
            const input = document.getElementById('audio-upload');
            const status = document.getElementById('status-text');
            const transcriptBox = document.getElementById('transcript');
            const resultBox = document.getElementById('result');
            input.value = '';
            status.innerText = '';
            status.style.color = '';
            transcriptBox.style.display = 'block';
            transcriptBox.innerText = 'Waiting for audio...';
            resultBox.style.display = 'none';
            resultBox.innerText = '';
            resultBox.className = 'result-box';
            document.getElementById('reset-btn').style.display = 'none';
        }

        // ---- Tabs ----
        function switchTab(name) {
            document.getElementById('tab-upload').classList.toggle('active', name === 'upload');
            document.getElementById('tab-live').classList.toggle('active', name === 'live');
            document.getElementById('tab-upload-btn').classList.toggle('active', name === 'upload');
            document.getElementById('tab-live-btn').classList.toggle('active', name === 'live');
            if (name !== 'live' && isLive) stopLive();
        }

        // ---- Live call monitor (3-second sliding window over WebSocket) ----
        const LIVE_WINDOW_MS = 3000;
        let mediaStream = null;
        let mediaRecorder = null;
        let liveSocket = null;
        let isLive = false;

        function renderLiveAlert(prediction) {
            const alertBox = document.getElementById('live-alert');
            if (!prediction) {
                alertBox.style.backgroundColor = '#374151';
                alertBox.innerText = '🎙️ Waiting for speech...';
                return;
            }
            if (prediction.toLowerCase().startsWith('scam')) {
                alertBox.style.backgroundColor = '#dc2626';
                alertBox.innerText = '🚨 SCAM ALERT — ' + prediction;
            } else {
                alertBox.style.backgroundColor = '#16a34a';
                alertBox.innerText = '✅ ' + prediction;
            }
        }

        function openLiveSocket() {
            return new Promise((resolve, reject) => {
                const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const socket = new WebSocket(`${proto}//${location.host}/ws/live`);
                socket.binaryType = 'arraybuffer';

                socket.onopen = () => resolve(socket);
                socket.onerror = (err) => reject(err);

                socket.onmessage = (event) => {
                    const liveStatus = document.getElementById('live-status');
                    const liveTranscript = document.getElementById('live-transcript');
                    let data;
                    try {
                        data = JSON.parse(event.data);
                    } catch (e) {
                        console.error('Bad message from live socket:', e);
                        return;
                    }
                    if (data.type === 'error') {
                        liveStatus.innerText = 'Error: ' + data.error;
                        return;
                    }
                    if (data.type !== 'result') return;
                    liveTranscript.innerText = data.transcript || '(listening...)';
                    renderLiveAlert(data.prediction);
                    liveStatus.innerText = `ASR: ${data.asr_latency.toFixed(2)}s | Classifier: ${data.clf_latency.toFixed(2)}s`;
                };

                socket.onclose = () => {
                    if (isLive) {
                        document.getElementById('live-status').innerText = 'Connection lost.';
                        stopLive();
                    }
                };
            });
        }

        function sendLiveChunk(blob) {
            if (!liveSocket || liveSocket.readyState !== WebSocket.OPEN) {
                // A dropped window is recoverable (next 3s chunk is on the way) -- log it
                // instead of overwriting the live status with a scary one-off network error.
                console.warn('Live socket not open, dropping this window.');
                return;
            }
            blob.arrayBuffer().then((buf) => liveSocket.send(buf));
        }

        function recordCycle() {
            if (!isLive || !mediaStream) return;
            const chunks = [];
            const recorderOptions = {};
            if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                recorderOptions.mimeType = 'audio/webm;codecs=opus';
            } else if (MediaRecorder.isTypeSupported('audio/webm')) {
                recorderOptions.mimeType = 'audio/webm';
            }
            mediaRecorder = new MediaRecorder(mediaStream, recorderOptions);
            mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
            mediaRecorder.onstop = async () => {
                if (chunks.length > 0) {
                    const blob = new Blob(chunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    await sendLiveChunk(blob);
                }
                recordCycle(); // start the next window
            };
            mediaRecorder.start();
            setTimeout(() => {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            }, LIVE_WINDOW_MS);
        }

        async function toggleLive() {
            if (isLive) {
                stopLive();
                return;
            }
            const btn = document.getElementById('live-toggle-btn');
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (err) {
                document.getElementById('live-status').innerText = 'Microphone access denied: ' + err.message;
                return;
            }

            document.getElementById('live-status').innerText = 'Connecting...';
            try {
                liveSocket = await openLiveSocket();
            } catch (err) {
                document.getElementById('live-status').innerText = 'Could not connect to live monitor.';
                mediaStream.getTracks().forEach((t) => t.stop());
                mediaStream = null;
                return;
            }

            isLive = true;
            btn.innerText = 'Stop Listening';
            btn.className = 'mic-btn stop';
            document.getElementById('live-transcript').innerText = '(listening...)';
            renderLiveAlert(null);
            document.getElementById('live-status').innerText = '';
            recordCycle();
        }

        function stopLive() {
            isLive = false;
            const btn = document.getElementById('live-toggle-btn');
            btn.innerText = 'Start Listening';
            btn.className = 'mic-btn start';

            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if (mediaStream) {
                mediaStream.getTracks().forEach((t) => t.stop());
                mediaStream = null;
            }
            if (liveSocket) {
                if (liveSocket.readyState === WebSocket.OPEN) {
                    liveSocket.send(JSON.stringify({ type: 'reset' }));
                }
                liveSocket.close();
                liveSocket = null;
            }
        }
    </script>
</body>
</html>
